# Run behind your own reverse proxy; do not publish the port to untrusted networks.
services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # For SQLite, mount the database file read-only and set BIBLIOTEQ_DB_URL=sqlite:////data/biblioteq.sqlite
    # volumes:
    #   - /path/to/biblioteq.sqlite:/data/biblioteq.sqlite:ro
