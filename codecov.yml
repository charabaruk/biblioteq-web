codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto        # no worse than the base commit
        threshold: 1%       # tolerate rounding jitter
        if_ci_failed: error
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true # report, don't fail -- flip this off later

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_head: true

github_checks:
  annotations: true

ignore:
  - "tests/**"
