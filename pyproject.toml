[project]
name = "biblioteq-web"
version = "0.2.0"
description = "Read-only web browser for BiblioteQ library collections"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Charabaruk" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not a11y'"
markers = ["a11y: browser-based accessibility tests, run with -m a11y (see docs/testing.md)"]

[tool.djlint]
profile = "jinja"
extensions = ["html", "jinja"]
exclude = [".venv", "venv", "node_modules", "vendor"]
ignore = "T001,T002,T003,H008,H009,H010,H011,H012,H014,H015,H020,H023,H024,H026,H029,H030,T032,H033"
