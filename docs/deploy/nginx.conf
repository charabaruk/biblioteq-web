# Example nginx server block for biblioteq-web (gunicorn listening on 127.0.0.1:8000).
# Add TLS (listen 443 ssl; certificates) and access control (auth_basic, allow/deny, or an OIDC proxy)
# before exposing this beyond a trusted network.

server {
    listen 80;
    server_name library.example.org;

    location /static/ {
        alias /opt/biblioteq-web/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Serving under a sub-path instead (e.g. https://example.org/library/):
#
#   location /library/ {
#       proxy_pass http://127.0.0.1:8000/;   # trailing slash strips the prefix
#       proxy_set_header Host $host;
#       proxy_set_header X-Forwarded-Proto $scheme;
#   }
#
# and set BIBLIOTEQ_ROOT_PATH=/library so generated links include the prefix.
